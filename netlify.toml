[build]
  command = "npm run build"
  publish = "dist"

# Members-only profile editor: reachable only by its direct link, never indexed by search engines.
# (Not listed in robots.txt on purpose, since that file is public and would advertise the path.)
[[headers]]
  for = "/profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
