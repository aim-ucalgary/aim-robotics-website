sectionLabel: "06 / TEAMS — MEMBERS"
heading: "The people behind the robots."
intro: >
  Meet the members of AIM, from the leadership team that keeps the club running
  to the subteams building every part of the system.

# Each group renders as its own block of profile cards.
# To add a member, add an entry under the right group and put their photo in /public.
# `photo`, `program`, and `linkedin` are optional — members without a photo show their initials.
groups:
  - id: leadership
    title: "Leadership"
    tag: "LEADERSHIP"
    members:
