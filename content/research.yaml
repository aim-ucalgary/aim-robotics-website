sectionLabel: "05 / RESEARCH"
heading: "Research"
intro: >
  AIM's research focuses on the core problems of autonomous robot soccer:
  coordinating a team of robots in real time, and planning and controlling
  fast, precise motion on the field.

# To add a research topic, add a new entry below and put its image in /public.
# `image` is optional — topics without one show an "Image coming soon" placeholder.
# `href` is optional — makes the card clickable:
#     "https://…"          opens that website in a new tab
#     "/research/…"        stays on the AIM site (same tab)
# `tag` is optional — adds a category to the caption, e.g. tag: "SOFTWARE" → "FIG. 01 · SOFTWARE".
